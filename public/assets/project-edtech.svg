    <rect x="0" y="0" width="155" height="215" rx="10" fill="#171722" stroke="#2c2c40" stroke-width="1" />
    <rect x="14" y="16" width="32" height="32" rx="8" fill="#ff5722" fill-opacity="0.2" />
    <text x="24" y="38" fill="#ff7a00" font-size="16" font-family="sans-serif">⚡</text>
    <text x="14" y="70" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold">Algorithm Pod</text>
    <text x="14" y="90" fill="#8e8ea6" font-size="10" font-family="sans-serif">6 Live Members</text>
