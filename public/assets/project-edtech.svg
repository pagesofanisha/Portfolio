<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="edBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14141d" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="glowOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21212e" />
      <stop offset="100%" stop-color="#181822" />
