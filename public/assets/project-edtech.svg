  <rect width="700" height="440" rx="16" fill="url(#edBg)" stroke="#2c2c3d" stroke-width="1.5" />
  
  <!-- App Window Bar -->
  <rect x="0" y="0" width="700" height="44" rx="16" fill="#181824" />
  <circle cx="28" cy="22" r="5" fill="#ff5f56" />
  <circle cx="44" cy="22" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="22" r="5" fill="#27c93f" />
  <rect x="180" y="12" width="340" height="20" rx="6" fill="#0d0d14" />
  <text x="350" y="26" fill="#7d7d91" font-size="11" font-family="sans-serif" text-anchor="middle">skillpulse.ai/dashboard/learning-matrix</text>
  
  <!-- Left Sidebar -->
  <rect x="20" y="60" width="140" height="360" rx="10" fill="#13131c" />
  <rect x="36" y="80" width="100" height="12" rx="4" fill="url(#glowOrange)" />
  <rect x="36" y="110" width="80" height="8" rx="3" fill="#323244" />
  <rect x="36" y="130" width="90" height="8" rx="3" fill="#323244" />
  <rect x="36" y="150" width="70" height="8" rx="3" fill="#323244" />
  <rect x="36" y="190" width="108" height="24" rx="6" fill="#ff5722" fill-opacity="0.15" stroke="#ff5722" stroke-width="1" />
  <text x="50" y="206" fill="#ff7a00" font-size="11" font-family="sans-serif" font-weight="bold">Study Pod 04</text>
  
  <!-- Main Content Area -->
  <rect x="180" y="60" width="495" height="130" rx="12" fill="url(#cardBg)" stroke="#2c2c40" stroke-width="1" />
  <text x="204" y="94" fill="#ffffff" font-size="18" font-family="sans-serif" font-weight="bold">AI Learning Sprint: Full-Stack Architecture</text>
  <text x="204" y="116" fill="#9e9eb4" font-size="12" font-family="sans-serif">CSBS Semester 4 Roadmap • 82% Completed</text>
  
  <!-- Progress Bar -->
  <rect x="204" y="136" width="380" height="8" rx="4" fill="#13131c" />
