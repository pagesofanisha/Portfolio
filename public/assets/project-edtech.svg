    <rect x="184" y="16" width="32" height="32" rx="8" fill="#2196f3" fill-opacity="0.2" />
    <text x="194" y="38" fill="#42a5f5" font-size="16" font-family="sans-serif">🧠</text>
    <text x="184" y="70" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold">AI Mentor Q&amp;A</text>
    <text x="184" y="90" fill="#8e8ea6" font-size="10" font-family="sans-serif">Instant Code Review</text>
    <rect x="184" y="110" width="126" height="4" rx="2" fill="#282838" />
    <rect x="184" y="110" width="110" height="4" rx="2" fill="#42a5f5" />
    <rect x="184" y="165" width="126" height="32" rx="6" fill="#232334" stroke="#3a3a4f" stroke-width="1" />
    <text x="247" y="185" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Ask Query</text>

    <!-- Card 3 -->
    <rect x="340" y="0" width="155" height="215" rx="10" fill="#171722" stroke="#2c2c40" stroke-width="1" />
    <rect x="354" y="16" width="32" height="32" rx="8" fill="#4caf50" fill-opacity="0.2" />
    <text x="364" y="38" fill="#66bb6a" font-size="16" font-family="sans-serif">🏆</text>
    <text x="354" y="70" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold">Leaderboard</text>
    <text x="354" y="90" fill="#8e8ea6" font-size="10" font-family="sans-serif">Top 2% at SRM IST</text>
    <rect x="354" y="110" width="126" height="4" rx="2" fill="#282838" />
    <rect x="354" y="110" width="120" height="4" rx="2" fill="#66bb6a" />
    <rect x="354" y="165" width="126" height="32" rx="6" fill="#232334" stroke="#3a3a4f" stroke-width="1" />
    <text x="417" y="185" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Rankings</text>
