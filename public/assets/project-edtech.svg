    <rect x="14" y="165" width="126" height="32" rx="6" fill="#ff5722" />
    <text x="77" y="185" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Join Room</text>

    <!-- Card 2 -->
