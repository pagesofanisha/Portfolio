<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151419" />
      <stop offset="100%" stop-color="#0a090c" />
    </linearGradient>
    <linearGradient id="glowWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
  </defs>
  <rect width="700" height="440" rx="16" fill="url(#ecoBg)" stroke="#2d2936" stroke-width="1.5" />
  <!-- Browser Header -->
  <rect x="0" y="0" width="700" height="42" rx="16" fill="#1b1822" />
  <circle cx="28" cy="21" r="5" fill="#ff5f56" />
  <circle cx="44" cy="21" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="21" r="5" fill="#27c93f" />
  <rect x="220" y="11" width="260" height="20" rx="5" fill="#0f0d14" />
  <text x="350" y="25" fill="#878396" font-size="11" font-family="sans-serif" text-anchor="middle">lumina-store.design/collection</text>

  <!-- Hero Banner Area -->
  <rect x="30" y="65" width="640" height="150" rx="12" fill="#1e1a26" stroke="#363044" stroke-width="1" />
  <text x="56" y="110" fill="#ffffff" font-size="22" font-family="sans-serif" font-weight="900">LUMINA ESSENTIALS '26</text>
  <text x="56" y="136" fill="#aba5bb" font-size="12" font-family="sans-serif">Crafted for creators. High-performance aesthetic design.</text>
  <rect x="56" y="156" width="130" height="34" rx="17" fill="url(#glowWarm)" />
  <text x="121" y="177" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Explore Drop →</text>
  
  <circle cx="560" cy="140" r="55" fill="#ff5500" fill-opacity="0.25" />
  <rect x="490" y="90" width="130" height="100" rx="10" fill="#292334" stroke="#483e58" stroke-width="1" />

  <!-- 3 Product Cards -->
  <g transform="translate(30, 235)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="200" height="175" rx="10" fill="#1a1721" stroke="#312b3d" stroke-width="1" />
    <rect x="15" y="15" width="170" height="90" rx="8" fill="#231f2d" />
    <circle cx="100" cy="60" r="28" fill="#ff7a00" fill-opacity="0.3" />
    <text x="15" y="125" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold">Studio Audio Pro</text>
    <text x="15" y="145" fill="#ff7a00" font-size="14" font-family="sans-serif" font-weight="bold">$249</text>
    <rect x="145" y="130" width="40" height="26" rx="6" fill="#ff5500" />
    <text x="165" y="147" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">+</text>

    <!-- Item 2 -->
    <rect x="220" y="0" width="200" height="175" rx="10" fill="#1a1721" stroke="#312b3d" stroke-width="1" />
    <rect x="235" y="15" width="170" height="90" rx="8" fill="#231f2d" />
    <rect x="285" y="40" width="70" height="40" rx="6" fill="#8b5cf6" fill-opacity="0.3" />
    <text x="235" y="125" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold">Kinetic Chrono Watch</text>
    <text x="235" y="145" fill="#ff7a00" font-size="14" font-family="sans-serif" font-weight="bold">$380</text>
    <rect x="365" y="130" width="40" height="26" rx="6" fill="#ff5500" />
    <text x="385" y="147" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">+</text>

    <!-- Item 3 -->
    <rect x="440" y="0" width="200" height="175" rx="10" fill="#1a1721" stroke="#312b3d" stroke-width="1" />
    <rect x="455" y="15" width="170" height="90" rx="8" fill="#231f2d" />
    <polygon points="540,35 570,80 510,80" fill="#06b6d4" fill-opacity="0.3" />
    <text x="455" y="125" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold">Titanium Pen Stylus</text>
    <text x="455" y="145" fill="#ff7a00" font-size="14" font-family="sans-serif" font-weight="bold">$95</text>
    <rect x="585" y="130" width="40" height="26" rx="6" fill="#ff5500" />
    <text x="605" y="147" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">+</text>
  </g>
</svg>

